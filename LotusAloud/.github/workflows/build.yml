name: Build Lotus Aloud APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build the app
        run: |
          DIR=$(dirname "$(find . -name gradlew | head -1)")
          cd "$DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assemblePersonalRelease bundlePlayRelease assemblePlayRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/personal/release/app-personal-release.apk "$GITHUB_WORKSPACE/LotusAloud.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "$GITHUB_WORKSPACE/LotusAloud-Play.aab"
          cp app/build/outputs/apk/play/release/app-play-release.apk "$GITHUB_WORKSPACE/LotusAloud-Play-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LotusAloud-apk
          path: |
            LotusAloud.apk
            LotusAloud-Play.aab
            LotusAloud-Play-test.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lotus Aloud 1.0.${{ github.run_number }}
          files: |
            LotusAloud.apk
            LotusAloud-Play.aab
            LotusAloud-Play-test.apk
          make_latest: true
