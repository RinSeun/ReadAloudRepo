name: Build Fish Reader APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build the app
        run: |
          DIR=$(dirname "$(find . -name gradlew | head -1)")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FishReader.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FishReader-apk
          path: FishReader.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fish Reader 1.0.${{ github.run_number }}
          files: FishReader.apk
          make_latest: true
