name: Build Fish Reader APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk FishReader.apk

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: FishReader-apk
          path: FishReader.apk

      - name: Publish to Releases (download it from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fish Reader 1.0.${{ github.run_number }}
          body: Download FishReader.apk below on your Android phone and open it to install or update.
          files: FishReader.apk
          make_latest: true
